name: CI

# Gate continuo: ogni push/PR ricostruisce il progetto. `npm run build` esegue in sequenza
# i 4 validatori anti-deriva (art · balance · audio · i18n), poi `tsc` (type-check) e la build Vite.
# Se codice e documenti divergono — o se i dizionari di lingua non sono allineati — la CI fallisce.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (validatori anti-deriva + tsc + vite)
        run: npm run build

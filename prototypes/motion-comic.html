<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion comic — prologo (prototipo procedurale · raffinato)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #stage {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: radial-gradient(120% 120% at 50% 40%, #0a0c10 0%, #000 80%);
    }
    canvas {
      image-rendering: auto;
      max-width: 100%; max-height: 100%; width: auto; height: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,.7);
    }
    #hud {
      position: fixed; left: 14px; top: 14px; z-index: 10; max-width: 330px;
      font: 12px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
      color: #c8d4e6; background: rgba(6,9,14,.55); border: 1px solid rgba(120,160,255,.18);
      padding: 11px 13px; border-radius: 10px; backdrop-filter: blur(6px);
      pointer-events: none; text-shadow: 0 1px 2px #000; transition: opacity .4s;
    }
    #hud h1 { margin: 0 0 5px; font-size: 12px; color: #fff; letter-spacing:.3px; }
    #hud .dim { color: #7d8ba6; }
    #hud .k { color: #ffcf7a; }
    #hud .warn { color: #ff9a6a; }
    #hint {
      position: fixed; right: 16px; bottom: 14px; z-index: 10;
      font: 12px ui-monospace, Consolas, monospace; color: #9fb0cc;
      background: rgba(6,9,14,.5); padding: 6px 11px; border-radius: 8px;
      border: 1px solid rgba(120,160,255,.16); text-shadow: 0 1px 2px #000; transition: opacity .4s;
    }
    .faded { opacity: 0 !important; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1600" height="900"></canvas></div>

  <div id="hud">
    <h1>Motion comic — prologo · raffinato</h1>
    <div class="dim">Pannelli dipinti 100% in codice (Canvas2D): tratteggio + parallasse multi-piano + braci/polvere. Nessun PNG, nessun video.</div>
    <div style="margin-top:7px" class="warn">⚠ Prototipo isolato — cancella questo file per rimuoverlo.</div>
  </div>
  <div id="hint">
    <span class="k">clic / SPAZIO</span> avanti · <span class="k">R</span> rivedi · <span class="k">A</span> audio · <span class="k">H</span> nascondi UI
  </div>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const hud = document.getElementById('hud'), hint = document.getElementById('hint');

  // ---- PRNG deterministico (mulberry32) ----------------------------------------------
  function rng(seed) { return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };}
  const ease = (t) => t * t * (3 - 2 * t);

  // ---- helper di disegno -------------------------------------------------------------
  function sky(a, b) {
    const g = ctx.createLinearGradient(0, -260, 0, H + 260);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(-260, -260, W + 520, H + 520);
  }
  function glow(x, y, r, color, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha ?? 1;
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  }
  // rim-light: ri-traccia l'ultimo path con un bordo luminoso (look "inchiostrato")
  function rim(color, w) { ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = color; ctx.lineWidth = w ?? 2; ctx.stroke(); ctx.restore(); }

  function skyline(seed, baseY, hMin, hMax, color, density, winColor, winChance, rimTop) {
    const r = rng(seed); let x = -40;
    while (x < W + 40) {
      const w = 50 + r() * 120, h = hMin + r() * (hMax - hMin);
      ctx.fillStyle = color; ctx.fillRect(x, baseY - h, w, h + 80);
      if (rimTop) { ctx.strokeStyle = rimTop; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, baseY - h); ctx.lineTo(x + w, baseY - h); ctx.stroke(); }
      if (winColor) {
        for (let wy = baseY - h + 14; wy < baseY - 8; wy += 22)
          for (let wx = x + 8; wx < x + w - 8; wx += 18)
            if (r() < winChance) {
              const fl = 0.5 + r() * 0.5;
              ctx.fillStyle = winColor.replace('A', fl.toFixed(2));
              ctx.fillRect(wx, wy, 7, 10);
            }
      }
      x += w * density;
    }
  }
  function figure(x, footY, h, w, rimCol) {
    const bw = 70 * w;
    ctx.beginPath();
    ctx.moveTo(x - bw / 2, footY);
    ctx.lineTo(x - bw / 2, footY - h * 0.62);
    ctx.quadraticCurveTo(x - bw / 2, footY - h * 0.78, x - bw * 0.28, footY - h * 0.80);
    ctx.lineTo(x - bw * 0.22, footY - h * 0.86);
    ctx.quadraticCurveTo(x, footY - h * 1.06, x + bw * 0.22, footY - h * 0.86);
    ctx.lineTo(x + bw * 0.28, footY - h * 0.80);
    ctx.quadraticCurveTo(x + bw / 2, footY - h * 0.78, x + bw / 2, footY - h * 0.62);
    ctx.lineTo(x + bw / 2, footY); ctx.closePath();
    ctx.fillStyle = '#04050a'; ctx.fill();
    if (rimCol) rim(rimCol, 2.2);
  }
  function hunched(x, footY, h, rimCol) {
    ctx.beginPath();
    ctx.moveTo(x - 16, footY);
    ctx.lineTo(x - 20, footY - h * 0.55);
    ctx.quadraticCurveTo(x - 22, footY - h * 0.8, x + 6, footY - h * 0.82);
    ctx.quadraticCurveTo(x + 24, footY - h * 0.95, x + 18, footY - h * 0.7);
    ctx.quadraticCurveTo(x + 22, footY - h * 0.5, x + 16, footY);
    ctx.closePath();
    ctx.fillStyle = '#010204'; ctx.fill();
    if (rimCol) rim(rimCol, 2.4);
  }
  // particelle (braci/polvere) che salgono in loop — vivono col tempo globale gt
  function motes(seed, count, area, color, size, speed, gt, sway, flick) {
    const r = rng(seed);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < count; i++) {
      const bx = area.x + r() * area.w, ph = r();
      const prog = ((gt * 0.00003 * speed) + ph) % 1;
      const y = area.y + area.h - prog * area.h;
      const x = bx + Math.sin(gt * 0.0006 + ph * 6.28) * sway;
      const a = Math.sin(prog * Math.PI) * (flick ? (0.5 + 0.5 * Math.sin(gt * 0.02 + i)) : 1);
      const s = size * (0.6 + r() * 0.8);
      const g = ctx.createRadialGradient(x, y, 0, x, y, s * 3);
      g.addColorStop(0, color.replace('A', (0.8 * a).toFixed(2)));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s * 3, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function coneLight(x, y, dx, len, color) {
    const g = ctx.createLinearGradient(x, y, x + dx, y + len);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + dx - 130, y + len); ctx.lineTo(x + dx + 130, y + len);
    ctx.closePath(); ctx.fill();
  }

  // ====================================================================================
  //  PANNELLI come PILE DI PIANI (parallasse). z: 0 = fondale, 1 = primo piano.
  // ====================================================================================
  const beats = [
    // ---- 1 — la città, prima ----------------------------------------------------------
    { caption: "Tre sere fa, alla radio, dicevano che era tutto sotto controllo.",
      kb: { z0: 1.12, z1: 1.26, panX: -0.022, panY: 0.018, fx: 0.45, fy: 0.52, dur: 9500 },
      layers: [
        { z: 0.0, draw: () => {
            sky('#0c0f15', '#3a2f2a');
            glow(W * 0.72, H * 0.74, 560, 'rgba(120,70,40,0.6)', 0.5);
            ctx.strokeStyle = 'rgba(18,22,28,0.8)'; ctx.lineWidth = 2; const rb = rng(99);
            for (let i = 0; i < 7; i++) { const bx = 200 + rb() * 1100, by = 130 + rb() * 150, s = 9 + rb() * 7;
              ctx.beginPath(); ctx.moveTo(bx - s, by); ctx.quadraticCurveTo(bx, by - s * 0.7, bx, by);
              ctx.quadraticCurveTo(bx, by - s * 0.7, bx + s, by); ctx.stroke(); } } },
        { z: 0.35, draw: () => skyline(11, H * 0.80, 120, 240, '#1a1f29', 1.02, 'rgba(255,200,120,A)', 0.10, 'rgba(120,90,60,0.5)') },
        { z: 0.6,  draw: () => skyline(23, H * 0.86, 180, 340, '#11151d', 0.92, 'rgba(255,190,110,A)', 0.16, 'rgba(150,110,70,0.45)') },
        { z: 0.92, draw: () => skyline(37, H * 0.96, 230, 430, '#080b10', 0.88, 'rgba(255,205,130,A)', 0.22, 'rgba(90,70,50,0.4)') },
      ] },
    // ---- 2 — la radio mente -----------------------------------------------------------
    { caption: "«Restate nelle case. Tornerà tutto normale.»",
      kb: { z0: 1.14, z1: 1.24, panX: 0.03, panY: 0.0, fx: 0.6, fy: 0.55, dur: 9000 },
      layers: [
        { z: 0.0, draw: (t, gt) => {
            sky('#0a0d12', '#05070a');
            glow(W * 0.20, H * 0.40, 130, 'rgba(255,207,122,0.85)', 0.6);   // lampada calda
            glow(W * 0.26, H * 0.52, 480, 'rgba(232,162,60,0.45)', 0.65);
            motes(71, 26, { x: W * 0.05, y: H * 0.2, w: W * 0.5, h: H * 0.6 }, 'rgba(255,220,160,A)', 1.3, 0.5, gt, 12, false); } },
        { z: 0.45, draw: (t, gt) => {
            ctx.fillStyle = '#0c0f14'; ctx.fillRect(0, H * 0.74, W, H);
            ctx.fillStyle = '#15110c'; ctx.beginPath();
            ctx.moveTo(W * 0.30, H * 0.74); ctx.lineTo(W * 0.92, H * 0.74);
            ctx.lineTo(W * 0.98, H * 0.86); ctx.lineTo(W * 0.24, H * 0.86); ctx.closePath(); ctx.fill();
            const rx = W * 0.60, ry = H * 0.66, pulse = 0.7 + 0.3 * Math.sin(gt * 0.006);
            glow(rx + 30, ry - 10, 240, 'rgba(90,127,168,0.9)', 0.5 * pulse);
            ctx.fillStyle = '#1b1c20'; ctx.fillRect(rx, ry - 70, 150, 90);
            ctx.fillStyle = '#0a0b0d'; ctx.fillRect(rx + 12, ry - 56, 80, 40);
            ctx.fillStyle = 'rgba(159,194,230,' + (0.85 * pulse).toFixed(2) + ')';
            ctx.fillRect(rx + 104, ry - 50, 30, 8); } },
        { z: 0.92, draw: () => {
            figure(W * 0.40, H * 0.76, 240, 1.0, 'rgba(232,162,60,0.22)');
            figure(W * 0.50, H * 0.76, 155, 0.78, 'rgba(90,127,168,0.30)'); } },
      ] },
    // ---- 3 — il crollo ----------------------------------------------------------------
    { caption: "Non è tornato niente.",
      kb: { z0: 1.10, z1: 1.30, panX: 0.02, panY: -0.026, fx: 0.66, fy: 0.32, dur: 9500 },
      layers: [
        { z: 0.0, draw: () => { sky('#0a0c10', '#191510'); glow(W * 0.18, H * 0.88, 560, 'rgba(192,83,31,0.55)', 0.6); } },
        { z: 0.25, draw: (t, gt) => {       // colonne di fumo che ondeggiano
            const rs = rng(7);
            for (let i = 0; i < 4; i++) { const sx = 150 + i * 380 + rs() * 80;
              ctx.fillStyle = 'rgba(29,32,38,0.45)'; ctx.beginPath();
              for (let yy = H * 0.6; yy > 20; yy -= 28) { const sway = Math.sin(yy * 0.01 + i + gt * 0.0004) * 60 * (1 - yy / H); ctx.lineTo(sx + sway - 40 * (1 - yy / H), yy); }
              for (let yy = 20; yy < H * 0.6; yy += 28) { const sway = Math.sin(yy * 0.01 + i + gt * 0.0004) * 60 * (1 - yy / H); ctx.lineTo(sx + sway + 40 * (1 - yy / H), yy); }
              ctx.fill(); } } },
        { z: 0.55, draw: () => {            // palazzi spezzati + l'unica finestra accesa
            skyline(51, H * 0.97, 240, 460, '#070a0e', 0.9, null, 0, 'rgba(60,50,44,0.5)');
            glow(W * 0.66, H * 0.30, 70, 'rgba(255,207,122,0.95)', 0.95);
            ctx.fillStyle = '#ffcf7a'; ctx.fillRect(W * 0.66 - 6, H * 0.30 - 9, 12, 18); } },
        { z: 0.95, draw: (t, gt) => {       // strada + figure curve (controluce con rim a brace)
            ctx.fillStyle = '#04060a'; ctx.fillRect(0, H * 0.82, W, H);
            glow(W * 0.5, H * 0.92, 700, 'rgba(120,50,24,0.20)', 0.7);     // sottofondo caldo per leggibilità
            const rz = rng(303);
            for (let i = 0; i < 9; i++) { const zx = 120 + rz() * 1360, zy = H * (0.83 + rz() * 0.1), zh = 80 + rz() * 60;
              hunched(zx, zy, zh, 'rgba(200,90,40,0.40)'); }
            motes(202, 22, { x: 0, y: H * 0.45, w: W, h: H * 0.5 }, 'rgba(255,140,60,A)', 1.6, 0.7, gt, 10, true); } },
      ] },
    // ---- 4 — il convoglio -------------------------------------------------------------
    { caption: "Restano la strada, il pieno di benzina,\ne chi è salito con te.",
      kb: { z0: 1.16, z1: 1.24, panX: 0.0, panY: 0.02, fx: 0.5, fy: 0.6, dur: 10000 },
      layers: [
        { z: 0.0, draw: () => { sky('#0a0d13', '#05070b'); glow(W * 0.5, H * 0.28, 320, 'rgba(90,127,168,0.4)', 0.45); } },
        { z: 0.4, draw: () => {            // orizzonte + strada in prospettiva
            ctx.fillStyle = '#070a0f'; ctx.fillRect(0, H * 0.58, W, H);
            ctx.fillStyle = '#0c1016'; ctx.beginPath();
            ctx.moveTo(W * 0.40, H * 0.58); ctx.lineTo(W * 0.60, H * 0.58);
            ctx.lineTo(W * 0.95, H); ctx.lineTo(W * 0.05, H); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(120,140,170,0.18)';
            for (let i = 0; i < 7; i++) { const tt = i / 7, yy = H * 0.6 + tt * tt * H * 0.42, wseg = 4 + tt * 30;
              ctx.fillRect(W * 0.5 - wseg / 2, yy, wseg, 6 + tt * 18); } } },
        { z: 0.85, draw: () => {           // il veicolo di spalle
            const vx = W * 0.5, vy = H * 0.70, s = 1;
            ctx.save(); ctx.globalCompositeOperation = 'lighter';
            coneLight(vx - 70, vy - 4, -150, -270, 'rgba(255,221,150,0.16)');
            coneLight(vx + 70, vy - 4, 150, -270, 'rgba(255,221,150,0.16)'); ctx.restore();
            ctx.fillStyle = '#05070b'; roundRect(vx - 150 * s, vy - 130 * s, 300 * s, 150 * s, 16); ctx.fill();
            rim('rgba(120,150,190,0.25)', 2);
            roundRect(vx - 120 * s, vy - 210 * s, 240 * s, 100 * s, 22); ctx.fillStyle = '#05070b'; ctx.fill();
            rim('rgba(120,150,190,0.30)', 2);
            ctx.fillStyle = '#0a0e14'; ctx.fillRect(vx - 130 * s, vy - 224 * s, 260 * s, 14 * s);
            glow(vx, vy - 150 * s, 95, 'rgba(232,162,60,0.32)', 0.55);
            ctx.fillStyle = 'rgba(40,30,18,0.9)'; ctx.fillRect(vx - 95 * s, vy - 195 * s, 190 * s, 64 * s);
            figure(vx - 45, vy - 131 * s, 120, 0.7, 'rgba(232,162,60,0.3)');
            figure(vx + 45, vy - 131 * s, 110, 0.7, 'rgba(232,162,60,0.3)');
            glow(vx - 120 * s, vy - 20 * s, 75, 'rgba(255,40,30,0.6)', 0.7);
            glow(vx + 120 * s, vy - 20 * s, 75, 'rgba(255,40,30,0.6)', 0.7);
            ctx.fillStyle = '#ff3326'; ctx.fillRect(vx - 142 * s, vy - 34 * s, 30, 18); ctx.fillRect(vx + 112 * s, vy - 34 * s, 30, 18); } },
        { z: 1.0, draw: (t, gt) => {
            ctx.fillStyle = 'rgba(40,44,52,0.22)'; ctx.beginPath(); ctx.ellipse(W * 0.5, H * 0.73, 230, 52, 0, 0, 7); ctx.fill();
            motes(404, 30, { x: W * 0.25, y: H * 0.62, w: W * 0.5, h: H * 0.3 }, 'rgba(150,140,120,A)', 1.4, 0.45, gt, 18, false); } },
      ] },
    // ---- 5 — title beat ---------------------------------------------------------------
    { caption: "NON BASTA ARRIVARE.", title: true,
      kb: { z0: 1.06, z1: 1.14, panX: 0.0, panY: 0.0, fx: 0.5, fy: 0.52, dur: 12000 },
      layers: [
        { z: 0.0, draw: () => { sky('#070a0f', '#020305'); glow(W * 0.5, H * 0.55, 400, 'rgba(40,60,90,0.25)', 0.4); } },
        { z: 0.9, draw: (t, gt) => { const fl = 0.5 + 0.5 * Math.sin(gt * 0.003);
            glow(W * 0.47, H * 0.52, 40, 'rgba(255,221,150,0.5)', 0.5 + 0.2 * fl);
            glow(W * 0.53, H * 0.52, 40, 'rgba(255,221,150,0.5)', 0.5 + 0.2 * fl); } },
      ] },
  ];

  // ---- texture: grana fine (3 tile) + tratteggio carboncino (1 tile) -----------------
  const grainTiles = [];
  for (let t = 0; t < 3; t++) {
    const gc = document.createElement('canvas'); gc.width = gc.height = 256;
    const g2 = gc.getContext('2d'), id = g2.createImageData(256, 256), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const v = 110 + Math.random() * 90 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    g2.putImageData(id, 0, 0); grainTiles.push(gc);
  }
  const hatch = (function () {
    const hc = document.createElement('canvas'); hc.width = hc.height = 128;
    const h2 = hc.getContext('2d');
    h2.strokeStyle = 'rgba(40,44,52,0.5)'; h2.lineWidth = 1;
    for (let i = -128; i < 128; i += 6) { h2.beginPath(); h2.moveTo(i, 0); h2.lineTo(i + 128, 128); h2.stroke(); }
    h2.strokeStyle = 'rgba(20,22,28,0.35)';
    for (let i = -128; i < 256; i += 9) { h2.beginPath(); h2.moveTo(i, 128); h2.lineTo(i + 128, 0); h2.stroke(); }
    return hc;
  })();

  function postFx(now) {
    // tratteggio carboncino (dà il "tono" da tavola disegnata, soprattutto nei mezzitoni)
    ctx.save(); ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'soft-light';
    for (let y = 0; y < H; y += 128) for (let x = 0; x < W; x += 128) ctx.drawImage(hatch, x, y);
    ctx.restore();
    // vignetta
    const vg = ctx.createRadialGradient(W / 2, H * 0.46, H * 0.24, W / 2, H * 0.5, H * 0.96);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.84)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    // grana fine animata
    ctx.save(); ctx.globalAlpha = 0.06; ctx.globalCompositeOperation = 'overlay';
    const tile = grainTiles[(now / 90 | 0) % 3];
    for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) ctx.drawImage(tile, x, y);
    ctx.restore();
    // barre cinema
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 70); ctx.fillRect(0, H - 70, W, 70);
  }

  // ---- caption (dissolvenza + macchina da scrivere) ----------------------------------
  function drawCaption(beat, charsShown, alpha) {
    if (!beat.caption) return;
    ctx.save(); ctx.globalAlpha = alpha;
    if (beat.title) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 84px "Georgia", "Times New Roman", serif'; ctx.fillStyle = '#f0ead8';
      ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 24;
      ctx.fillText(beat.caption.slice(0, charsShown), W / 2, H * 0.44); ctx.shadowBlur = 0;
      if (charsShown >= beat.caption.length) {
        ctx.font = '300 22px ui-monospace, monospace';
        ctx.fillStyle = 'rgba(220,210,190,' + (0.4 + 0.4 * Math.sin(performance.now() / 380)).toFixed(2) + ')';
        ctx.fillText('clic per cominciare', W / 2, H * 0.62);
      }
      ctx.restore(); return;
    }
    const lines = beat.caption.split('\n');
    const g = ctx.createLinearGradient(0, H * 0.66, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(4,6,10,0.9)');
    ctx.fillStyle = g; ctx.fillRect(0, H * 0.66, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = 'italic 400 40px "Georgia", "Times New Roman", serif';
    ctx.fillStyle = '#e6ddcb'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 14;
    const baseY = H - 150 - (lines.length - 1) * 28; let total = 0;
    for (let i = 0; i < lines.length; i++) {
      let lineChars = '';
      for (let c = 0; c < lines[i].length; c++) { if (total < charsShown) lineChars += lines[i][c]; total++; }
      total++;
      ctx.fillText(lineChars, W / 2, baseY + i * 56);
    }
    ctx.restore();
  }

  // ---- AUDIO procedurale (drone + soffio ai cambi) -----------------------------------
  let actx = null, droneGain = null, audioOn = false;
  function initAudio() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    droneGain = actx.createGain(); droneGain.gain.value = 0; droneGain.connect(actx.destination);
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320; lp.connect(droneGain);
    [55, 82.4, 110].forEach((f, i) => { const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      o.detune.value = (i - 1) * 6; const g = actx.createGain(); g.gain.value = i === 0 ? 0.5 : 0.22;
      o.connect(g); g.connect(lp); o.start(); });
  }
  function setAudio(on) { audioOn = on; if (on) { initAudio(); if (actx.state === 'suspended') actx.resume(); }
    if (droneGain) droneGain.gain.setTargetAtTime(on ? 0.14 : 0, actx.currentTime, 0.6); }
  function whoosh() {
    if (!audioOn || !actx) return;
    const n = actx.createBufferSource(), len = actx.sampleRate * 0.9;
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    n.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 220; bp.Q.value = 0.7;
    const g = actx.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(0.12, actx.currentTime, 0.05);
    g.gain.setTargetAtTime(0, actx.currentTime + 0.15, 0.25);
    n.connect(bp); bp.connect(g); g.connect(actx.destination); n.start();
  }

  // ---- MOTORE: FADE_IN → HOLD → FADE_OUT → next --------------------------------------
  const FADE = 900;
  let idx = 0, phase = 'in', t0 = performance.now();
  function start(i) { idx = i; phase = 'in'; t0 = performance.now(); whoosh(); }
  function restart() { start(0); }
  function advance() {
    if (phase === 'out') return;
    if (idx >= beats.length - 1) return;
    phase = 'out'; t0 = performance.now();
  }

  function frame(now) {
    const beat = beats[idx], kb = beat.kb, elapsed = now - t0;
    let alpha = 1;
    if (phase === 'in') { alpha = Math.min(1, elapsed / FADE); if (elapsed >= kb.dur) { phase = 'out'; t0 = now; } }
    else if (phase === 'out') { alpha = Math.max(0, 1 - elapsed / FADE);
      if (elapsed >= FADE) { if (idx < beats.length - 1) start(idx + 1); else { phase = 'in'; t0 = now; } } }
    const life = phase === 'in' ? Math.min(1, elapsed / kb.dur) : 1;
    const e = ease(life);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    const zoomBase = kb.z0 + (kb.z1 - kb.z0) * e;
    const cx = W * kb.fx, cy = H * kb.fy;
    for (const Lr of beat.layers) {
      const scale = zoomBase * (0.97 + Lr.z * 0.15);
      const panX = kb.panX * W * e * (0.15 + Lr.z);
      const panY = kb.panY * H * e * (0.15 + Lr.z);
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.translate(cx + panX, cy + panY); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
      Lr.draw(life, now);
      ctx.restore();
    }

    ctx.globalAlpha = 1; postFx(now);

    const holdElapsed = phase === 'in' ? elapsed - FADE : kb.dur;
    const cps = beat.title ? 14 : 32;
    drawCaption(beat, Math.max(0, Math.floor((holdElapsed / 1000) * cps)), alpha);

    requestAnimationFrame(frame);
  }

  // ---- input -------------------------------------------------------------------------
  function onAdvance() { if (!audioOn) setAudio(true); advance(); }
  window.addEventListener('pointerdown', onAdvance);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); onAdvance(); }
    else if (e.key === 'r' || e.key === 'R') restart();
    else if (e.key === 'a' || e.key === 'A') setAudio(!audioOn);
    else if (e.key === 'h' || e.key === 'H') { hud.classList.toggle('faded'); hint.classList.toggle('faded'); }
  });

  start(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
